name: Refresh LeetCode stats
on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/update_leetcode.py, .github/workflows/leetcode-stats.yml]
permissions:
  contents: write
  pages: write
concurrency:
  group: leetcode-stats
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/update_leetcode.py
      - name: Save stats and request Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add leetcode-stats.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh LeetCode stats"
            git push
            gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
          fi
